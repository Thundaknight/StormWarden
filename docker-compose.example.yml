# Example deployment on StormTower (Unraid). Adjust the repo path mount to wherever
# your compose projects live. The host path and container path MUST be identical so
# that `docker compose` (which talks to the host's Docker daemon) resolves relative
# build contexts and bind mounts to the right place on the host.
services:
  stormwarden:
    image: thundaknight/stormwarden:latest
    container_name: stormwarden
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - TZ=America/Vancouver
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/appdata/stormwarden:/app/data
      # Same-path mount for script working directories (e.g. Frostgate's repo):
      - /mnt/user/appdata/repos:/mnt/user/appdata/repos
      # Optional: SSH key for `git pull` on private repos (read-only)
      # - /mnt/user/appdata/stormwarden/ssh:/root/.ssh:ro
